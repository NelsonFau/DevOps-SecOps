name: SAST - Semgrep

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep
        run: semgrep --config p/default --config p/owasp-top-ten --error .